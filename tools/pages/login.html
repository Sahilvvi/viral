<!--
title: Log in to ViralX
description: Log in to your ViralX client portal to follow your launch projects and download your cuts.
scripts: /js/auth.js
-->
    <section class="auth">
      <aside class="auth-side">
        <img class="bg" src="/assets/frames/f_6.4.jpg" alt="" />
        <div>
          <h2>Welcome <em class="serif grad-text">back.</em></h2>
          <ul><li>See where every launch stands</li><li>Review cuts and download masters</li><li>Start a new brief in two minutes</li></ul>
        </div>
      </aside>
      <div class="auth-main">
        <div class="auth-card">
          <h1>Log in</h1>
          <p>Access your client portal.</p>
          <div class="form-msg err setup-note" id="setupNote" hidden>Accounts are being set up. Email <a class="link" href="mailto:{{site.email}}">{{site.email}}</a> for access.</div>
          <div class="oauth"><button type="button" data-oauth="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button></div>
          <div class="or">OR</div>
          <form class="form" data-auth="login" novalidate>
            <label class="field">Email<input name="email" type="email" autocomplete="email" required /></label>
            <label class="field">Password<input name="password" type="password" autocomplete="current-password" required /></label>
            <div class="auth-row"><span></span><a class="link" href="#" id="forgotLink">Forgot password?</a></div>
            <button class="btn btn-primary btn-lg" type="submit">Log in</button>
            <div class="form-msg" id="authMsg" role="status"></div>
          </form>
          <p class="auth-alt">New to ViralX? <a href="/signup/">Create an account</a></p>
        </div>
      </div>
    </section>
