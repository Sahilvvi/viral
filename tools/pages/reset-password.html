<!--
title: Reset your ViralX password
description: Choose a new password for your ViralX account.
scripts: /js/auth.js
noindex: 1
-->
    <section class="auth" style="grid-template-columns:1fr">
      <div class="auth-main">
        <div class="auth-card">
          <h1>New password</h1>
          <p>Choose a new password for your account.</p>
          <div class="form-msg err setup-note" id="setupNote" hidden>Accounts are being set up.</div>
          <form class="form" data-auth="reset" novalidate>
            <label class="field">New password<input name="password" type="password" autocomplete="new-password" required minlength="8" /></label>
            <label class="field">Confirm password<input name="confirm" type="password" autocomplete="new-password" required minlength="8" /></label>
            <button class="btn btn-primary btn-lg" type="submit">Update password</button>
            <div class="form-msg" id="authMsg" role="status"></div>
          </form>
          <p class="auth-alt"><a href="/login/">Back to log in</a></p>
        </div>
      </div>
    </section>
